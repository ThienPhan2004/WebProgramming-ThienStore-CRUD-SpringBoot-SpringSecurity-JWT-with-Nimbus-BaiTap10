<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Đăng ký</title>
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px">
    <h3 class="mb-4 text-center">Đăng ký</h3>
    <div id="alert" class="alert alert-danger d-none" role="alert"></div>
    <form id="registerForm" novalidate>
        <div class="mb-3">
            <label for="fullName" class="form-label">Họ tên</label>
            <input type="text" class="form-control" id="fullName" name="fullName" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required autocomplete="username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Mật khẩu (6–72 ký tự)</label>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-success w-100">Tạo tài khoản</button>
    </form>
    <p class="mt-3 text-center">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
</div>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
