spring.application.name=jwt-login
server.port=8005

# ===== MySQL (đổi qua biến môi trường hoặc sửa trực tiếp) =====
spring.datasource.url=jdbc:mysql://localhost:3306/jwt_login?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=123456

# ===== Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== JWT (Nimbus, HS256) =====
# Khóa Base64, sau khi giải mã phải >= 32 byte. Tạo khóa mới: openssl rand -base64 32
security.jwt.secret-key=${JWT_SECRET:J7oiYOfNGC357sxQ+HNTpYAjTRNI97ngNiyiE5xDT/k=}
# 1 giờ (ms)
security.jwt.expiration-time=3600000
# Đặt true khi chạy HTTPS
security.jwt.cookie-secure=false

# https://www.jwt.io/
